name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMPERSONATION_SECRET: ${{ secrets.IMPERSONATION_SECRET }}
          QR_ROTATION_SECONDS: "10"
          QR_TOKEN_TTL_SECONDS: "15"
      - run: node scripts/palette-check.mjs
      - run: node scripts/bundle-budget.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: bundle-report.json

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMPERSONATION_SECRET: ${{ secrets.IMPERSONATION_SECRET }}
          QR_ROTATION_SECONDS: "10"
          QR_TOKEN_TTL_SECONDS: "15"
      # Lighthouse has no login flow; it audits the public routes (see lighthouserc.json).
      # /student (Today) and /student/timetable (attendance) are behind middleware auth.
      - run: npx @lhci/cli@0.14.x autorun

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD